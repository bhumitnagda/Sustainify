{% extends "partials/base.html" %}
{% load static %}

{% block content %}
<section class="vh-100 bg-image" style="background-image: url('https://mdbcdn.b-cdn.net/img/Photos/new-templates/search-box/img4.webp');">
  <div class="mask d-flex align-items-center h-100 gradient-custom-3">
    <div class="container h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-12 col-md-9 col-lg-7 col-xl-6">
          <div class="card" style="border-radius: 15px;">
            <div class="card-body p-5">
              {% if messages %}
                {% for message in messages %}
                  <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
              {% if form.errors %}
                <div class="alert alert-danger">
                  <strong>{{ form.errors }}</strong>
                </div>
              {% endif %}
              <h2 class="text-uppercase text-center mb-5">Sign In</h2>

              <form method="POST" action="">
                {% csrf_token %}
                <div class="form-outline mb-4">
                  <input type="email" id="id_email" name="email" class="form-control form-control-lg" placeholder="Your Email"/>
                  <label class="form-label" for="id_email">Your Email</label>
                </div>

                <div class="form-outline mb-4">
                  <input type="password" id="id_password" name="password" class="form-control form-control-lg" placeholder="Password"/>
                  <label class="form-label" for="id_password">Password</label>
                </div>

                <div class="d-flex justify-content-center">
                  <button type="submit" class="btn btn-success btn-block btn-lg gradient-custom-4 text-body">Sign In</button>
                </div>
              </form>
              
              <div class="text-center mt-4">
                <p class="mb-0">Don't have an account? <a href="{% url 'userauths:sign-up' %}" class="fw-bold text-body"><u>Register here</u></a></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock content %}
