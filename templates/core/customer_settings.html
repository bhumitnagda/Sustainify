{% extends "partials/base.html" %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Settings</h2>
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-3">
            <div class="list-group">
                <a href="{% url 'core:customer_dashboard' %}" class="list-group-item list-group-item-action">
                    Overview
                </a>
                <a href="{% url 'core:customer_orders' %}" class="list-group-item list-group-item-action">
                    Orders
                </a>
                <a href="{% url 'core:customer_account' %}" class="list-group-item list-group-item-action">
                    Account Details
                </a>
                <a href="{% url 'core:customer_settings' %}" class="list-group-item list-group-item-action active">
                    Settings
                </a>
                <a href="{% url 'userauths:sign-out' %}" class="list-group-item list-group-item-action text-danger">
                    Logout
                </a>
            </div>
        </div>
        <!-- Settings Content -->
        <div class="col-md-9">
            <div class="card">
                <div class="card-header">
                    Settings
                </div>
                <div class="card-body">
                    <h5 class="card-title">Customize Your Experience</h5>
                    <p class="card-text">
                        Update your preferences—because, like a timeless suit, the perfect settings never go out of style!
                    </p>
                    <form method="post" action="{% url 'core:update_settings' %}">
                        {% csrf_token %}
                        <!-- Insert your settings form fields here -->
                        <div class="mb-3">
                            <label for="notification" class="form-label">Email Notifications</label>
                            <select id="notification" name="notification" class="form-select">
                                <option value="enabled">Enabled</option>
                                <option value="disabled">Disabled</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Settings</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
